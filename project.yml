# XcodeGen source of truth: edit here, then `xcodegen --spec project.yml`.
name: Jolt
options:
  bundleIdPrefix: cz.peelco
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Project-wide so the app and its extension can't drift apart: iOS
    # refuses to install an app whose extension has a different version.
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    # Shared between the app and JoltNotificationService. The keychain group
    # holds the relay payload keys the extension decrypts with; both appear in
    # each target's entitlements and Info.plist.
    JOLT_APP_GROUP: group.cz.peelco.jolt
    JOLT_SHARED_KEYCHAIN_GROUP: cz.peelco.jolt.shared
targets:
  Jolt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Features
      - Domain
      - BLE
      - Data
      - Shared
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - Jolt.entitlements
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "YCFL9S5UA8"
        PRODUCT_BUNDLE_IDENTIFIER: "cz.peelco.jolt"
        PRODUCT_NAME: "Jolt"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this, `Color.accentColor`/`.tint(.accentColor)` silently
        # fall back to system blue even though Resources/Assets.xcassets
        # already has an AccentColor color set (the brand green) — Xcode
        # only wires a same-named color set up as the real system accent
        # color when this is set explicitly.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # No INFOPLIST_KEY_* settings here on purpose: Xcode only honours them
        # when it generates the Info.plist (GENERATE_INFOPLIST_FILE = YES).
        # This target ships an explicit one, so they were silently dropped —
        # CFBundleDisplayName and ITSAppUsesNonExemptEncryption were both set
        # this way and neither reached the built app. They live in
        # Resources/Info.plist instead.
        INFOPLIST_FILE: Resources/Info.plist
        # Server a fresh install points at (Info.plist JoltDefaultServerURL).
        # A placeholder here; release builds override it on the command line
        # (fastlane reads JOLT_DEFAULT_SERVER_URL from the environment).
        JOLT_DEFAULT_SERVER_URL: "https://jolt.example.com/api/v1"
        # Push relays the app will register with (Info.plist
        # JoltTrustedRelayHosts), space-separated host names. Empty here, so a
        # build from source trusts no relay; release builds set it on the
        # command line (fastlane reads JOLT_TRUSTED_RELAY_HOSTS).
        JOLT_TRUSTED_RELAY_HOSTS: ""
        CODE_SIGN_ENTITLEMENTS: Resources/Jolt.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      # aps-environment is $(APS_ENVIRONMENT) in Jolt.entitlements, resolved
      # per configuration: a debug build talks to APNs sandbox, a Release
      # build (Archive → TestFlight/App Store) to production. This must match
      # the server's APNS_ENV, or for a relayed server the relay's (the app
      # tells the relay which one its token belongs to). App Attest follows
      # the same split.
      configs:
        Debug:
          APS_ENVIRONMENT: development
          APP_ATTEST_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          APP_ATTEST_ENVIRONMENT: production
    dependencies:
      - target: JoltNotificationService
    scheme:
      testTargets:
        - JoltUITests
        - JoltTests
      gatherCoverageData: true
  # Rewrites relayed alerts with the decrypted poke before iOS shows them.
  # Compiles the push code it needs from the app's own sources rather than a
  # framework: Shared/ plus the three payload models.
  JoltNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NotificationService
        excludes:
          - Info.plist
          - JoltNotificationService.entitlements
      - Shared
      - Domain/Models/Stimulus.swift
      - Domain/Models/PokePushPayload.swift
      - Domain/Models/TestPushPayload.swift
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "YCFL9S5UA8"
        PRODUCT_BUNDLE_IDENTIFIER: "cz.peelco.jolt.NotificationService"
        PRODUCT_NAME: "JoltNotificationService"
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/JoltNotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  JoltUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - UITests
    dependencies:
      - target: Jolt
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "YCFL9S5UA8"
        PRODUCT_BUNDLE_IDENTIFIER: "cz.peelco.jolt.uitests"
        TEST_TARGET_NAME: "Jolt"
        GENERATE_INFOPLIST_FILE: YES
  JoltTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - JoltTests
    dependencies:
      - target: Jolt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "cz.peelco.jolt.tests"

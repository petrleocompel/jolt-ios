# XcodeGen project — substitute placeholders, then `xcodegen --spec project.yml`
# Optional: add JoltTests unit-test target (recommended).
name: Jolt
options:
  bundleIdPrefix: cz.peelco
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Jolt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Features
      - Domain
      - BLE
      - Data
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "REDACTED"
        PRODUCT_BUNDLE_IDENTIFIER: "cz.peelco.jolt"
        PRODUCT_NAME: "Jolt"
        INFOPLIST_KEY_CFBundleDisplayName: "Jolt"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    scheme:
      testTargets:
        - JoltUITests
        - JoltTests
      gatherCoverageData: true
  JoltUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - UITests
    dependencies:
      - target: Jolt
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "REDACTED"
        PRODUCT_BUNDLE_IDENTIFIER: "cz.peelco.jolt.uitests"
        TEST_TARGET_NAME: "Jolt"
        GENERATE_INFOPLIST_FILE: YES
  JoltTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - JoltTests
    dependencies:
      - target: Jolt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "cz.peelco.jolt.tests"

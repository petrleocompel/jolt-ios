# Jolt iOS GitLab CI (the maintainer's private pipeline: builds, TestFlight,
# App Store assets). Public checks run in .github/workflows instead.
# Runner tag: macos. CI variables: APP_STORE_CONNECT_KEY_ID,
# APP_STORE_CONNECT_ISSUER_ID, APPSTORE_CONNECT_API_KEY (base64 .p8, group),
# JOLT_DEFAULT_SERVER_URL, JOLT_TRUSTED_RELAY_HOSTS, JOLT_TEST_EMAIL,
# JOLT_TEST_PASSWORD; optional APP_IDENTIFIER, APPLE_TEAM_ID.
# Signed builds cover two bundle IDs, the app and its Notification Service
# Extension (cz.peelco.jolt.NotificationService); automatic signing with the
# App Store Connect key provisions both.

stages:
  - validate
  - build
  - distribute
  - publish

variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  APP_IDENTIFIER: "cz.peelco.jolt"
  FASTLANE_RUN_XCODEGEN: "1"
  # xcodegen regenerates the project each run, so -showBuildSettings is always
  # cold (~23s measured); fastlane defaults to 3s x 4 retries.
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
  # Base64 .p8 arrives as the group variable APPSTORE_CONNECT_API_KEY
  ASC_KEY_FILE: "$CI_PROJECT_DIR/fastlane/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

default:
  tags:
    - macos
  before_script:
    - export VERSION_CODE=$CI_PIPELINE_IID && echo "VERSION_CODE=$VERSION_CODE"
    - command -v xcodegen >/dev/null && xcodegen --spec project.yml || true
    - bundle config set --local path 'vendor/bundle'
    - bundle install

ios_validate:
  stage: validate
  variables:
    # xcodebuild hands TEST_RUNNER_* variables to the UI-test runner with the
    # prefix stripped; QuickPokeComposerUITests skips when they are unset.
    TEST_RUNNER_JOLT_TEST_EMAIL: "$JOLT_TEST_EMAIL"
    TEST_RUNNER_JOLT_TEST_PASSWORD: "$JOLT_TEST_PASSWORD"
    TEST_RUNNER_JOLT_TEST_SERVER_URL: "$JOLT_DEFAULT_SERVER_URL"
  script:
    - bundle exec fastlane dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  artifacts:
    when: always
    paths:
      - fastlane
      - DerivedData/Logs/Test
    expire_in: 3 days

# MODULE: internal
ios_internal_release:
  stage: distribute
  script:
    - echo "$APPSTORE_CONNECT_API_KEY" | base64 -d > "$ASC_KEY_FILE"
    - export APP_STORE_CONNECT_API_KEY_PATH="$ASC_KEY_FILE"
    - bundle exec fastlane internal
  # after_script runs even when the lane fails, so the key never survives the job
  after_script:
    - rm -f "$ASC_KEY_FILE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  artifacts:
    when: always
    paths:
      - build/internal
      - fastlane
    expire_in: 7 days
# END MODULE: internal

# MODULE: testflight
ios_testflight_release:
  stage: distribute
  script:
    - echo "$APPSTORE_CONNECT_API_KEY" | base64 -d > "$ASC_KEY_FILE"
    - export APP_STORE_CONNECT_API_KEY_PATH="$ASC_KEY_FILE"
    - bundle exec fastlane testflight
  # after_script runs even when the lane fails, so the key never survives the job
  after_script:
    - rm -f "$ASC_KEY_FILE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  artifacts:
    when: always
    paths:
      - build/prod
      - fastlane
    expire_in: 14 days
# END MODULE: testflight

# MODULE: store assets
# Captures screenshots on the simulator, flattens their alpha channel (App
# Store Connect rejects PNGs with transparency), then uploads screenshots and
# the text metadata under fastlane/metadata.
#
# Manual and last on purpose: it mutates the App Store listing, takes several
# minutes of simulator time, and is almost never wanted on an ordinary push.
# Sitting in the final stage means it only becomes available once validate,
# build and distribute have passed, so a listing is never updated for a build
# that failed.
#
# Needs ImageMagick on the runner (`brew install imagemagick`) — the flatten
# step fails with a clear message if it is missing. Simulator names come from
# fastlane/Snapfile and can be overridden here without touching it.
ios_store_assets:
  stage: publish
  variables:
    IPHONE_65_NAME: "iPhone 17 Pro Max"
    IPAD_13_NAME: "iPad Pro 13-inch (M5)"
  script:
    - echo "$APPSTORE_CONNECT_API_KEY" | base64 -d > "$ASC_KEY_FILE"
    - export APP_STORE_CONNECT_API_KEY_PATH="$ASC_KEY_FILE"
    - bundle exec fastlane store_assets
  # after_script runs even when the lane fails, so the key never survives the job
  after_script:
    - rm -f "$ASC_KEY_FILE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      # Not allow_failure: if someone deliberately pressed publish and it
      # failed, the pipeline should say so rather than stay green.
      allow_failure: false
  artifacts:
    when: always
    paths:
      - fastlane/screenshots
      - fastlane/metadata
      - fastlane
    expire_in: 14 days
# END MODULE: store assets

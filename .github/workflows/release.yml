name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # Notes only: the app ships through TestFlight / the App Store, built by
    # the maintainer's private pipeline, so no IPA is attached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
